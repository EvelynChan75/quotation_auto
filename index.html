<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寬聯資訊股份有限公司 - 報價單系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        
        /* A4 列印設定 */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .print-container {
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                border: none !important;
            }
            input, textarea, select {
                border: none !important;
                background: transparent !important;
                resize: none !important;
                padding: 0 !important;
            }
            /* 隱藏原生 input number 的箭頭 */
            input[type=number]::-webkit-inner-spin-button,
            input[type=number]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            input[type=number] {
                -moz-appearance: textfield;
            }
        }

        /* 隱藏數字輸入框的上下箭頭 */
        .no-spinner::-webkit-inner-spin-button,
        .no-spinner::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .no-spinner {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="py-4 px-4 min-h-screen">

    <!-- 控制面板 (列印時隱藏) -->
    <div class="max-w-4xl mx-auto mb-4 bg-white p-3.5 rounded-xl shadow-md border border-gray-200 no-print">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-file-invoice text-xl text-cyan-600"></i>
                <h1 class="text-lg font-bold text-gray-800">線上報價單產生器</h1>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="loadSampleData()" class="px-3.5 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> 載入預設資料
                </button>
                <button onclick="clearData()" class="px-3.5 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 text-sm font-medium rounded-lg transition duration-200 flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> 清空
